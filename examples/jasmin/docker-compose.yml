# Cellophane as the upstream operator behind a Jasmin SMS gateway.
#
#   docker compose up -d
#   curl "http://localhost:1401/send?username=demo&password=demo&from=MyApp&to=8801711111111&content=Hello+via+Jasmin"
#
# Jasmin accepts the message on its HTTP API, routes it to its SMPP client connector "cellophane", and the
# message lands in the Cellophane inbox at http://localhost:8025 with the receipt Cellophane sends back.
# The jasmin-setup service configures the connector, a user and a default route once through jCli.
services:
  cellophane:
    image: ${CELLOPHANE_IMAGE:-ghcr.io/tareqmy/cellophane}
    ports:
      - "8025:8025"   # inbox and API; Jasmin reaches SMPP inside the network as cellophane:2775
    environment:
      CELLOPHANE_ACCOUNTS: "jasmin:jasmin:50"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  rabbitmq:
    # 3.x: RabbitMQ 4 no longer permits the transient non-exclusive queues Jasmin 0.11 declares.
    image: rabbitmq:3.13-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  jasmin:
    image: jookies/jasmin:latest
    # Jasmin must find its broker and Redis at start-up, or the connector wizard fails with "channel not ready".
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      cellophane:
        condition: service_started
    ports:
      - "1401:1401"   # Jasmin HTTP API
      - "8990:8990"   # jCli (telnet, jcliadmin / jclipwd)
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbitmq
    volumes:
      - jasmin-store:/etc/jasmin/store

  jasmin-setup:
    image: alpine:3
    depends_on:
      - jasmin
    volumes:
      - ./configure-jasmin.sh:/configure-jasmin.sh:ro
    command: sh /configure-jasmin.sh

volumes:
  jasmin-store:
