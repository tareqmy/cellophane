spring:
  application:
    name: cellophane
  mvc:
    problemdetails:
      # Errors as RFC 9457 JSON so scripts and the UI can read the reason from "detail".
      enabled: true

server:
  port: ${CELLOPHANE_HTTP_PORT:8025}
  # The UI keeps an SSE stream open, so a graceful shutdown would always wait out its timeout.
  shutdown: immediate

cellophane:
  smpp-port: ${CELLOPHANE_SMPP_PORT:2775}
  accounts: ${CELLOPHANE_ACCOUNTS:cellophane:cellophane}
  max-messages: ${CELLOPHANE_MAX_MESSAGES:10000}
  rules: ${CELLOPHANE_RULES:}

springdoc:
  api-docs:
    path: /api/openapi.json
  swagger-ui:
    path: /api

logging:
  level:
    io.cellophane: info
