<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Cellophane">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- a see-through cell -->
  <polygon points="48,6 84,27 84,69 48,90 12,69 12,27" fill="url(#g)" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="48,18 74,33 74,63 48,78 22,63 22,33" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
  <!-- signal bars showing through -->
  <rect x="33" y="54" width="6" height="12" rx="1.5" fill="#0ea5e9"/>
  <rect x="45" y="44" width="6" height="22" rx="1.5" fill="#0ea5e9"/>
  <rect x="57" y="34" width="6" height="32" rx="1.5" fill="#0ea5e9"/>
</svg>
