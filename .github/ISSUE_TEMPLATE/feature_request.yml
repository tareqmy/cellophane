name: Feature request
description: Something Cellophane should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to test or see, and why the current features fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What it could look like: a rule, an endpoint, a UI element.
