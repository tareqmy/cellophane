name: publish

# Tag a release as v1.2.3 to build the image and push it to GHCR as
# ghcr.io/<owner>/cellophane:1.2.3 and :latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Test, build the image and smoke-test it
        run: >
          ./gradlew build :server:imageTest --no-daemon
          -PreleaseVersion=${{ steps.meta.outputs.version }}
          -PimageRepository=${{ steps.meta.outputs.image }}

      - name: Build and publish image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :server:bootBuildImage --no-daemon
          -PreleaseVersion=${{ steps.meta.outputs.version }}
          -PimageRepository=${{ steps.meta.outputs.image }}
          -PpublishImage=true
