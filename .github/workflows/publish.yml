name: publish

# Tag a release as v1.2.3 to build the image and push it to GHCR as
# ghcr.io/<owner>/cellophane:1.2.3 and :latest.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Work out version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Test, build the image and smoke-test it
        run: >
          ./mvnw -B -ntp -Pimage verify
          -Drevision=${{ steps.meta.outputs.version }}
          -Dimage.repository=${{ steps.meta.outputs.image }}

      - name: Publish the image
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        # Same profile as the smoke test; the image layers are cached from the previous step.
        run: >
          ./mvnw -B -ntp -Pimage -DskipTests verify
          -Drevision=${{ steps.meta.outputs.version }}
          -Dimage.repository=${{ steps.meta.outputs.image }}
          -Dimage.publish=true
