name: publish

# Tag a release as v1.2.3 to build the image for linux/amd64 and linux/arm64 and push it to GHCR as
# ghcr.io/<owner>/cellophane:1.2.3 and :latest, one manifest covering both architectures. If the repository
# has DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets, the same manifest is also pushed to Docker Hub as
# <username>/cellophane.
#
# Buildpacks build one architecture per run, so each architecture is built and smoke-tested natively on its
# own runner and pushed as 1.2.3-amd64 / 1.2.3-arm64; the manifest job then joins the two.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Work out version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Test, build the ${{ matrix.arch }} image and smoke-test it
        run: >
          ./mvnw -B -ntp -Pimage verify
          -Drevision=${{ steps.meta.outputs.version }}
          -Dimage.repository=${{ steps.meta.outputs.image }}
          -Dspring-boot.build-image.imagePlatform=linux/${{ matrix.arch }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the ${{ matrix.arch }} image under an architecture tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "$IMAGE:$VERSION" "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"

  manifest:
    name: multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Work out version and image name
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish 1.2.3 and latest as one multi-arch manifest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: >
          docker buildx imagetools create
          -t "$IMAGE:$VERSION" -t "$IMAGE:latest"
          "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Also push the manifest to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        # imagetools copies the layers across registries, so no local pull is needed.
        run: >
          docker buildx imagetools create
          -t "docker.io/$DOCKERHUB_USERNAME/cellophane:$VERSION" -t "docker.io/$DOCKERHUB_USERNAME/cellophane:latest"
          "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
